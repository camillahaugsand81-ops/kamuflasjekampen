<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamuflasjekampen – Kunstutgaven</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2eee5;color:#282b28;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:20px}h1{margin:0 0 10px}button,input,select{font:inherit;border-radius:8px;border:1px solid #aaa;padding:9px}button{background:#275e4b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}input[type=color]{padding:2px;width:55px;height:42px;vertical-align:middle}.hide{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}.panel{background:white;border:1px solid #d5d2c8;border-radius:12px;padding:15px;margin:10px 0}.muted{color:#5c625d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:16px}.scene{position:relative;aspect-ratio: 4/3;background:#b4b4b4 center/100% 100% no-repeat;border:8px solid #394c42;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:manipulation}.creature{position:absolute;width:12%;aspect-ratio:1.45;transform:translate(-50%,-50%);pointer-events:none;object-fit:fill;filter:drop-shadow(0 1px 1px #2228)}.preview{position:absolute;width:12%;aspect-ratio:1.45;transform:translate(-50%,-50%);pointer-events:none;opacity:.95}#paintCanvas{width:100%;height:auto;max-width:240px;aspect-ratio:1.45;border:1px dashed #999;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 50%/18px 18px;touch-action:none;cursor:crosshair}#paintbox{text-align:center}#paintbox label{display:block;margin:8px 0}.painting-choice{max-width:100%}.status{font-weight:700}.small{font-size:13px}.credits{font-size:12px;color:#555;margin-top:8px}.scenehint{font-size:14px}.found{opacity:.3}.pill{display:inline-block;background:#e5eee5;padding:5px 9px;border-radius:15px}#scene canvas{pointer-events:none} @media(max-width:780px){.layout{grid-template-columns:1fr}.scene{border-width:4px}}
</style></head><body><main><h1>🦎 Kamuflasjekampen <small class="muted">Kunstutgaven</small></h1><section id="join" class="panel"><p>Mal deg inn i et kjent kunstverk – og finn de andre!</p><input id="name" placeholder="Kallenavn" maxlength="20"><div class="toolbar"><button id="create">Opprett rom (lærer)</button><span>eller</span><input id="code" placeholder="Romkode" maxlength="6"><button id="enter">Bli med</button></div><p id="error" role="alert"></p></section><section id="game" class="hide"><div class="toolbar"><h2 style="margin:0">Romkode: <span id="room"></span></h2><span class="pill" id="status"></span><span id="clock"></span></div><div class="panel toolbar" id="hosttools"><label>Maleri: <select id="painting" class="painting-choice"><option value="starry">Vincent van Gogh – Stjernenatt (1889)</option><option value="scream">Edvard Munch – Skrik (1893)</option><option value="lilies">Claude Monet – Vannliljer (1916–19)</option><option value="kiss">Gustav Klimt – Kysset (1907–08)</option></select></label><button id="start">Start runde</button></div><div class="layout"><div><div id="scene" class="scene" aria-label="Maleri og gjemmesteder"></div><p class="credits" id="credit"></p><p class="scenehint" id="hint"></p><p id="scores"></p></div><aside id="paintbox" class="panel hide"><h3>Mal kameleonen din</h3><canvas id="paintCanvas" width="260" height="180"></canvas><label>Farge <input id="color" type="color" value="#315b88"> <button id="pipette" type="button">🎨 Hent farge fra bildet</button></label><label>Penselstørrelse <input id="brush" type="range" min="3" max="42" value="14"></label><div class="toolbar" style="justify-content:center"><button id="reset">Start malingen på nytt</button><button id="done">Ferdig!</button></div><p class="small muted">Mal direkte på figuren. Klikk deretter på maleriet for å velge gjemmested. Trykk Ferdig når du er fornøyd.</p><p class="small" id="ready"></p></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const art={starry:{name:'Stjernenatt',artist:'Vincent van Gogh',year:'1889',url:'https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?width=1400'},scream:{name:'Skrik',artist:'Edvard Munch',year:'1893',url:'https://commons.wikimedia.org/wiki/Special:FilePath/The_Scream.jpg?width=1400'},lilies:{name:'Vannliljer',artist:'Claude Monet',year:'ca. 1916–1919',url:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg?width=1400'},kiss:{name:'Kysset',artist:'Gustav Klimt',year:'1907–1908',url:'https://commons.wikimedia.org/wiki/Special:FilePath/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg?width=1400'}};
const $=id=>document.getElementById(id),socket=io();let me,room,state,placed={x:.5,y:.5},picking=false,paintingImage=new Image(),painted=false,stroke=false,ready=false;
const canvas=$('paintCanvas'),ctx=canvas.getContext('2d');const mask=document.createElement('canvas');mask.width=260;mask.height=180;const mc=mask.getContext('2d');
function shape(c){c.beginPath();c.ellipse(115,93,90,56,0,0,Math.PI*2);c.fill();c.beginPath();c.arc(204,70,30,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(30,95);c.bezierCurveTo(-15,30,12,150,45,130);c.bezierCurveTo(10,150,-4,107,30,95);c.fill();c.beginPath();c.moveTo(88,133);c.lineTo(65,165);c.lineTo(110,150);c.fill();c.beginPath();c.moveTo(158,133);c.lineTo(185,165);c.lineTo(143,150);c.fill()}
function reset(){ctx.clearRect(0,0,260,180);ctx.fillStyle='#8cbf83';shape(ctx);mc.clearRect(0,0,260,180);mc.fillStyle='white';shape(mc);ctx.fillStyle='white';ctx.beginPath();ctx.arc(212,61,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#162b23';ctx.beginPath();ctx.arc(215,61,5,0,Math.PI*2);ctx.fill();painted=false;updatePreview()}
function output(){const tmp=document.createElement('canvas');tmp.width=260;tmp.height=180;let c=tmp.getContext('2d');c.drawImage(canvas,0,0);c.globalCompositeOperation='destination-in';c.drawImage(mask,0,0);return tmp.toDataURL('image/png')}
function updatePreview(){const prev=$('scene').querySelector('.preview');if(prev)prev.src=output()}
function coords(e,el){const r=el.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
function brush(e){let a=coords(e,canvas),x=a.x*260,y=a.y*180;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+$('brush').value;ctx.strokeStyle=$('color').value;ctx.lineTo(x,y);ctx.stroke();painted=true;updatePreview()}
canvas.addEventListener('pointerdown',e=>{if(ready)return;stroke=true;canvas.setPointerCapture(e.pointerId);let a=coords(e,canvas);ctx.beginPath();ctx.moveTo(a.x*260,a.y*180);brush(e)});canvas.addEventListener('pointermove',e=>{if(stroke)brush(e)});canvas.addEventListener('pointerup',()=>stroke=false);canvas.addEventListener('pointercancel',()=>stroke=false);$('reset').onclick=()=>{if(!ready)reset()};$('pipette').onclick=()=>{picking=true;$('hint').textContent='Klikk på en farge i maleriet. Merk: pipetten krever at bildet tillater fargeavlesning.'};
function join(create){socket.emit('join',{name:$('name').value,code:$('code').value,create},r=>{if(r.error){$('error').textContent=r.error;return}me=r.id;room=r.code;$('join').classList.add('hide');$('game').classList.remove('hide');$('room').textContent=room})}$('create').onclick=()=>join(true);$('enter').onclick=()=>join(false);$('start').onclick=()=>socket.emit('start');$('painting').onchange=()=>socket.emit('painting',$('painting').value);
$('scene').onclick=e=>{if(state?.phase!=='paint'||ready)return;const pos=coords(e,$('scene'));if(picking){picking=false;try{const cv=document.createElement('canvas');cv.width=paintingImage.naturalWidth;cv.height=paintingImage.naturalHeight;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(paintingImage,0,0);const data=cx.getImageData(Math.floor(pos.x*(cv.width-1)),Math.floor(pos.y*(cv.height-1)),1,1).data;$('color').value='#'+[...data].slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');$('hint').textContent='Fargen er hentet! Mal figuren og velg gjemmested.'}catch{$('hint').textContent='Bildet tillater ikke pipette her. Bruk fargevelgeren i stedet.'}return}placed=pos;socket.emit('place',pos);updatePreview()};
$('done').onclick=()=>{if(!state||state.phase!=='paint'||ready)return;ready=true;$('done').disabled=true;$('reset').disabled=true;socket.emit('submit',{art:output(),...placed});$('ready').textContent='Ferdig! Venter på de andre.'};
function setArt(id){const a=art[id]||art.starry;const scene=$('scene');scene.style.backgroundImage=`url("${a.url}")`;paintingImage=new Image();paintingImage.crossOrigin='anonymous';paintingImage.src=a.url;$('credit').textContent=`${a.artist}: ${a.name} (${a.year}). Bildekilde: Wikimedia Commons. Kontroller bildekilde og lisens før bruk.`}
function draw(r){state=r;$('status').textContent={lobby:'Venter på spillere',paint:'Mal og gjem deg',hunt:'Finn kameleonene!',results:'Runden er ferdig!'}[r.phase];$('hosttools').classList.toggle('hide',r.host!==me);$('painting').disabled=!['lobby','results'].includes(r.phase);$('painting').value=r.painting;$('start').classList.toggle('hide',!['lobby','results'].includes(r.phase));$('start').textContent=r.phase==='results'?'Neste runde':'Start runde';$('start').disabled=r.players.length<2;const mine=r.players.find(p=>p.id===me);$('paintbox').classList.toggle('hide',r.phase!=='paint');$('scores').textContent=r.players.map(p=>`${p.name}: ${p.score} poeng${r.phase==='paint'?(p.ready?' ✓':' ⏳'):''}`).join(' · ');$('scene').querySelectorAll('.creature,.preview').forEach(e=>e.remove());if(r.phase==='paint'&&mine){if(!ready){const el=document.createElement('img');el.className='preview';el.style.left=(placed.x*100)+'%';el.style.top=(placed.y*100)+'%';el.src=output();$('scene').append(el)}$('hint').textContent=ready?'Du er klar. Venter på de andre.':'Mal figuren til høyre, og klikk i maleriet for å gjemme den.'}else if(r.phase==='hunt'){$('hint').textContent='Finn de malte kameleonene i maleriet! Klikk der du ser dem.';}else if(r.phase==='results'){$('hint').textContent='Her gjemte alle seg. Læreren kan starte neste runde.'}else $('hint').textContent='Læreren velger maleri og starter runden.';
 if(r.phase==='results'||r.phase==='hunt'){for(const p of r.players){if(!p.art|| (r.phase==='hunt'&&(p.id===me||p.found)))continue;let img=document.createElement('img');img.className='creature';img.src=p.art;img.style.left=p.x*100+'%';img.style.top=p.y*100+'%';img.title=r.phase==='results'?p.name:'';$('scene').append(img)}}}
let lastRound=0,lastPainting='';socket.on('state',r=>{if(r.round!==lastRound){lastRound=r.round;ready=false;placed={x:.5,y:.5};$('done').disabled=false;$('reset').disabled=false;$('ready').textContent='';reset()}if(r.painting!==lastPainting){lastPainting=r.painting;setArt(r.painting)}draw(r)});
$('scene').addEventListener('click',e=>{if(state?.phase!=='hunt')return;const p=coords(e,$('scene'));for(const target of state.players){if(target.id!==me&&!target.found)socket.emit('find',{id:target.id,...p})}});
setInterval(()=>{$('clock').textContent=state?.ends?`Tid igjen: ${Math.max(0,Math.ceil((state.ends-Date.now())/1000))} sek`:''},300);reset();
</script></body></html>
