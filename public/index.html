<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamuflasjekampen</title><style>body{font-family:system-ui;background:#e8f0dc;color:#20372a;margin:0;padding:20px}main{max-width:900px;margin:auto}button,input,select{font:inherit;padding:10px;margin:5px;border-radius:9px;border:1px solid #779476}button{background:#386d4b;color:white;cursor:pointer}.hide{display:none}#scene{height:400px;position:relative;overflow:hidden;border:8px solid #56704a;border-radius:16px;background:repeating-linear-gradient(125deg,#8fa879 0 45px,#698c64 45px 85px,#b5ad80 85px 125px)}.leaf{position:absolute;font-size:60px;opacity:.65;pointer-events:none}.creature{position:absolute;width:65px;height:48px;border-radius:55% 55% 45% 45%;border:3px solid #344b35;cursor:pointer;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;font-size:22px}.creature:before{content:'◉';position:absolute;top:1px;right:9px;color:white;text-shadow:1px 1px #222}.creature.spots{background-image:radial-gradient(#344b3577 20%,transparent 23%);background-size:18px 18px}.creature.stripes{background-image:repeating-linear-gradient(45deg,transparent 0 10px,#344b3566 10px 16px)}#status{font-weight:bold}#scores{line-height:2}small{display:block}</style></head><body><main><h1>🦎 Kamuflasjekampen</h1><section id="join"><p>Mal deg inn i naturen – finn de andre!</p><input id="name" placeholder="Fornavn eller kallenavn" maxlength="20"><p><button id="create">Opprett rom (lærer)</button> eller <input id="code" placeholder="Romkode" maxlength="6"><button id="enter">Bli med</button></p><p id="error"></p></section><section id="game" class="hide"><h2>Romkode: <span id="room"></span></h2><p id="status"></p><p id="clock"></p><div id="controls" class="hide"><label>Farge <input type="color" id="color" value="#66854b"></label><label>Mønster <select id="pattern"><option value="spots">Prikker</option><option value="stripes">Striper</option><option value="plain">Ensfarget</option></select></label><small>Trykk på bakgrunnen for å velge gjemmested. Fargen og mønsteret kan endres helt til tiden er ute.</small></div><div id="scene"><span class="leaf" style="left:10%;top:5%">🌿</span><span class="leaf" style="left:65%;top:10%">🍃</span><span class="leaf" style="left:35%;top:72%">🌾</span><span class="leaf" style="left:80%;top:65%">🌿</span></div><p id="scores"></p><button id="start" class="hide">Start neste runde</button></section></main><script src="/socket.io/socket.io.js"></script><script>const socket=io(),$=id=>document.getElementById(id);let me,room,state;function join(create){socket.emit('join',{name:$('name').value,code:$('code').value,create},r=>{if(r.error){$('error').textContent=r.error;return}me=r.id;room=r.code;$('join').classList.add('hide');$('game').classList.remove('hide');$('room').textContent=room})}$('create').onclick=()=>join(true);$('enter').onclick=()=>join(false);$('start').onclick=()=>socket.emit('start');function paint(){socket.emit('paint',{color:$('color').value,pattern:$('pattern').value})}$('color').oninput=paint;$('pattern').onchange=paint;$('scene').onclick=e=>{if(state?.phase!=='paint'||e.target.closest('.creature'))return;let b=$('scene').getBoundingClientRect();socket.emit('place',{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height})};socket.on('state',r=>{state=r;let mine=r.players.find(p=>p.id===me);$('status').textContent={lobby:'Venter på spillere',paint:'Mal figuren og velg gjemmested',hunt:'Finn de andre! Trykk på figurene',results:'Runden er ferdig!'}[r.phase]||'';$('controls').classList.toggle('hide',r.phase!=='paint');$('start').classList.toggle('hide',r.host!==me||!['lobby','results'].includes(r.phase));$('start').textContent=r.phase==='lobby'?'Start spillet':'Ny runde';$('scores').textContent=r.players.map(p=>`${p.name}: ${p.score} poeng`).join(' • ');$('scene').querySelectorAll('.creature').forEach(n=>n.remove());for(const p of r.players){if(r.phase==='lobby'||(r.phase==='paint'&&p.id!==me))continue;if(r.phase==='hunt'&&p.id===me)continue;let d=document.createElement('div');d.className='creature '+p.pattern;d.style.backgroundColor=p.color;d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%';d.style.opacity=p.found&&r.phase==='hunt'?.35:1;d.title=r.phase==='results'?p.name:'';d.onclick=e=>{e.stopPropagation();if(r.phase==='hunt')socket.emit('find',p.id)};d.textContent=r.phase==='results'?p.name.slice(0,1):' ';$('scene').append(d)}if(mine&&r.phase==='paint'){$('color').value=mine.color;$('pattern').value=mine.pattern}});setInterval(()=>{$('clock').textContent=state?.ends?`Tid igjen: ${Math.max(0,Math.ceil((state.ends-Date.now())/1000))} sekunder`:''},300);</script></body></html>
